name: Buscador de licitaciones

# Se ejecuta en TU computadora (runner "self-hosted" con Windows), porque el portal
# del OECE rechaza las consultas que vienen de los servidores de GitHub (fuera del Peru).
# Si la PC esta apagada a la hora programada, la tarea espera (hasta 24 h) y corre
# apenas la PC se encienda.

on:
  schedule:
    # Cada 3 horas (6:43, 9:43, 12:43, 15:43, 18:43 y 21:43 hora Peru). GitHub a veces atrasa u omite
    # ejecuciones programadas; con varias al dia, si una se pierde la siguiente la cubre.
    - cron: "43 2,11,14,17,20,23 * * *"
  push:                     # al guardar un barrido de LinkedIn o un cambio del buscador, corre al toque
    branches: [main]
    paths:
      - "buscador/**"
      - "docs/index.html"
      - ".github/workflows/buscador.yml"
  workflow_dispatch:
    inputs:
      diagnostico:
        description: "Guardar muestra cruda de la API (si/no)"
        default: "no"

permissions:
  contents: write

concurrency:
  group: buscador-licitaciones
  cancel-in-progress: false

jobs:
  buscar:
    runs-on: [self-hosted, Windows]
    timeout-minutes: 60
    env:
      PYTHONUTF8: "1"
      PYTHONIOENCODING: "utf-8"
    steps:
      - uses: actions/checkout@v4

      - name: Preparar Python
        shell: cmd
        run: |
          python -m venv .venv || exit /b 1
          .venv\Scripts\python.exe -m pip install --quiet --disable-pip-version-check -r requirements.txt || exit /b 1

      - name: Buscar licitaciones y enviar correo
        shell: cmd
        env:
          CORREO_DESTINO: ${{ secrets.CORREO_DESTINO }}
          GMAIL_USUARIO: ${{ secrets.GMAIL_USUARIO }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          BREVO_API_KEY: ${{ secrets.BREVO_API_KEY }}
          BREVO_REMITENTE: ${{ secrets.BREVO_REMITENTE }}
          DIAGNOSTICO: ${{ github.event.inputs.diagnostico == 'si' && '1' || '0' }}
        run: .venv\Scripts\python.exe buscador\licitaciones.py

      - name: Guardar resultados en el repositorio
        if: always()
        shell: cmd
        run: |
          git config user.name "buscador-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rem Limpia un rebase que haya quedado a medias en una ejecucion anterior
          git rebase --abort 1>nul 2>nul
          if exist ".git\rebase-merge" rmdir /s /q ".git\rebase-merge"
          if exist ".git\rebase-apply" rmdir /s /q ".git\rebase-apply"
          if exist ".git\index.lock" del /f /q ".git\index.lock"
          git add docs estado.json || exit /b 1
          git status --short
          if exist muestra_api.json git add muestra_api.json
          git diff --cached --quiet && (echo Sin cambios que guardar) || (git commit -m "Actualizacion de licitaciones" && (git pull --rebase --autostash -X theirs origin main || (git rebase --abort & git pull --no-rebase --no-edit -X ours origin main)) && git push)
