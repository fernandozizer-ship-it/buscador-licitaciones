name: Buscador de licitaciones

on:
  schedule:
    - cron: "7 12 * * *"    # 7:07 a. m. hora Perú (todos los días)
    - cron: "7 23 * * *"    # 6:07 p. m. hora Perú (todos los días)
  workflow_dispatch:         # botón "Run workflow" para ejecutarlo a mano
    inputs:
      diagnostico:
        description: "Guardar muestra cruda de la API (si/no)"
        default: "no"

permissions:
  contents: write

concurrency:
  group: buscador-licitaciones
  cancel-in-progress: false

jobs:
  buscar:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Buscar licitaciones y enviar correo
        env:
          CORREO_DESTINO: ${{ secrets.CORREO_DESTINO }}
          GMAIL_USUARIO: ${{ secrets.GMAIL_USUARIO }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          BREVO_API_KEY: ${{ secrets.BREVO_API_KEY }}
          BREVO_REMITENTE: ${{ secrets.BREVO_REMITENTE }}
          DIAGNOSTICO: ${{ github.event.inputs.diagnostico == 'si' && '1' || '0' }}
        run: python buscador/licitaciones.py

      - name: Guardar resultados en el repositorio
        if: always()
        run: |
          git config user.name "buscador-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs estado.json
          if [ -f muestra_api.json ]; then git add muestra_api.json; fi
          if git diff --cached --quiet; then
            echo "Sin cambios que guardar"
          else
            git commit -m "Actualización de licitaciones $(date -u +'%Y-%m-%d %H:%M') UTC"
            git push
          fi
